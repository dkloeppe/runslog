<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunsLog &mdash; Raw Data</title>
<link rel="icon" type="image/png" sizes="16x16" href="runslog-favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="runslog-favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="runslog-favicon-48x48.png">
<link rel="icon" type="image/png" sizes="64x64" href="runslog-favicon-64x64.png">
<link rel="icon" type="image/png" sizes="128x128" href="runslog-favicon-128x128.png">
<link rel="icon" type="image/png" sizes="256x256" href="runslog-favicon-256x256.png">
<link rel="apple-touch-icon" href="runslog-favicon-256x256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111b1a;
    --panel:#182524;
    --panel-2:#1e2e2c;
    --paper:#eef0e6;
    --paper-dim:#c7cdc0;
    --trail:#d99a45;
    --trail-dim:#8a672f;
    --moss:#7fa06d;
    --rust:#c1613a;
    --slate:#8fa199;
    --hair:rgba(238,240,230,0.09);
    --hair-strong:rgba(238,240,230,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:0 28px 80px;}
  .nav{
    display:flex;justify-content:space-between;align-items:center;
    padding:26px 28px;max-width:1200px;margin:0 auto;border-bottom:1px solid var(--hair);
  }
  .nav .mark{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.14em;color:var(--slate);display:flex;align-items:center;gap:9px;}
  .nav .mark img{height:22px;width:22px;border-radius:5px;display:block;}
  .back-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:transparent;border:1px solid var(--hair-strong);color:var(--paper-dim);
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.04em;
    padding:9px 16px;border-radius:8px;text-decoration:none;transition:border-color .15s,color .15s;
  }
  .back-btn:hover{border-color:var(--trail);color:var(--paper);}
  .hero{padding:40px 28px 8px;max-width:1200px;margin:0 auto;}
  .hero-label{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:var(--trail);margin:0 0 6px;}
  .hero h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(40px,7vw,72px);
    line-height:0.95;margin:0 0 10px;color:var(--paper);letter-spacing:0.01em;font-weight:400;
  }
  .hero-sub{font-size:15px;color:var(--paper-dim);margin:0 0 28px;max-width:640px;}
  .controls{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px;
    padding:16px 18px;background:var(--panel);border:1px solid var(--hair);border-radius:12px;
  }
  .controls input[type="search"]{
    flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--hair-strong);
    color:var(--paper);font-family:'Inter',sans-serif;font-size:14px;padding:10px 14px;border-radius:8px;
    outline:none;
  }
  .controls input[type="search"]::placeholder{color:var(--slate);}
  .controls input[type="search"]:focus{border-color:var(--trail-dim);}
  .controls select{
    background:var(--panel-2);border:1px solid var(--hair-strong);color:var(--paper);
    font-family:'IBM Plex Mono',monospace;font-size:12px;padding:9px 12px;border-radius:8px;outline:none;
  }
  .result-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate);white-space:nowrap;}
  .table-card{
    background:var(--panel);border:1px solid var(--hair);border-radius:12px;overflow:hidden;
  }
  .table-scroll{overflow-x:auto;}
  table.data-table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap;}
  table.data-table thead th{
    text-align:left;color:var(--slate);font-weight:500;font-size:11px;
    text-transform:uppercase;letter-spacing:0.06em;padding:12px 14px;border-bottom:1px solid var(--hair-strong);
    background:var(--panel-2);position:sticky;top:0;cursor:pointer;user-select:none;
  }
  table.data-table thead th:hover{color:var(--paper);}
  table.data-table thead th.sorted::after{content:' \2193';color:var(--trail);}
  table.data-table thead th.sorted.asc::after{content:' \2191';color:var(--trail);}
  table.data-table td{padding:10px 14px;border-bottom:1px solid var(--hair);color:var(--paper-dim);}
  table.data-table td.mono{font-family:'IBM Plex Mono',monospace;color:var(--paper);}
  table.data-table tbody tr:hover{background:var(--panel-2);}
  table.data-table tbody tr:last-child td{border-bottom:none;}
  .badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;
    padding:2px 8px;border-radius:20px;text-transform:uppercase;border:1px solid var(--moss);color:var(--moss);
  }
  .badge.race{border-color:var(--rust);color:var(--rust);}
  .badge.club{border-color:var(--trail);color:var(--trail);}
  footer{padding:36px 0 0;color:var(--slate);font-size:12px;font-family:'IBM Plex Mono',monospace;text-align:center;}
  footer .footer-logo{display:inline-block;line-height:0;margin-bottom:12px;}
  footer .footer-logo img{height:40px;width:auto;display:block;margin:0 auto;}
  .empty-state{padding:60px 20px;text-align:center;color:var(--slate);font-size:14px;}
</style>
</head>
<body>

<div class="nav">
  <div class="mark"><img src="runslog-favicon-64x64.png" alt="RunsLog logo">RunsLog</div>
  <a class="back-btn" href="index.html">&larr; Back to dashboard</a>
</div>

<div class="hero">
  <p class="hero-label">Raw data</p>
  <h1>Every logged run</h1>
  <p class="hero-sub" id="heroSub">Loading&hellip;</p>
</div>

<div class="wrap">
  <div class="controls">
    <input type="search" id="searchBox" placeholder="Search by shoe, city, run type, terrain, note&hellip;">
    <select id="yearFilter"><option value="">All years</option></select>
    <span class="result-count" id="resultCount"></span>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table class="data-table" id="runsTable">
        <thead>
          <tr>
            <th data-key="id">#</th>
            <th data-key="date_sort" class="sorted">Date</th>
            <th data-key="miles">Distance</th>
            <th data-key="time_str">Time</th>
            <th data-key="pace_sort">Pace</th>
            <th data-key="elev_sort">Elev gain</th>
            <th data-key="cal_sort">Calories</th>
            <th data-key="app">App</th>
            <th data-key="city">City</th>
            <th data-key="run_type">Type</th>
            <th data-key="terrain">Terrain</th>
            <th data-key="note">Note</th>
            <th data-key="shoe">Shoes</th>
          </tr>
        </thead>
        <tbody id="runsBody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">No runs match your search.</div>
  </div>

  <footer>
    <a class="footer-logo" href="index.html"><img src="RunsLog-Logo.png" alt="RunsLog logo"></a>
    <div class="footer-text">Built from runs log &middot; <span id="footerCount"></span> runs shown of <span id="footerTotal"></span></div>
  </footer>
</div>

// Pre-compute sortable fields
function paceToMinutes(p){
  if(!p || p.indexOf(':')===-1) return null;
  const [m,s] = p.split(':').map(Number);
  return m + s/60;
}
function dateToSortable(str){
  // "Aug 2, 2026" -> sortable number
  return new Date(str).getTime();
}
RUNS.forEach(r=>{
  r.date_sort = dateToSortable(r.date_str);
  r.pace_sort = paceToMinutes(r.pace_str);
  r.elev_sort = Number(r.elev_gain) || 0;
  r.cal_sort = Number(r.calories) || 0;
});

const years = Array.from(new Set(RUNS.map(r=>r.date_str.slice(-4)))).sort().reverse();
const yearFilter = document.getElementById('yearFilter');
years.forEach(y=>{
  const opt = document.createElement('option');
  opt.value = y; opt.textContent = y;
  yearFilter.appendChild(opt);
});

document.getElementById('heroSub').textContent = RUNS.length + ' runs logged, most recent first. Search or sort by any column below.';
document.getElementById('footerTotal').textContent = RUNS.length;

let sortKey = 'date_sort';
let sortDir = 'desc';

function badgeClass(type){
  if(type === 'Race') return 'badge race';
  if(type === 'Run Club') return 'badge club';
  return 'badge';
}

function render(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const yr = yearFilter.value;
  let rows = RUNS.filter(r=>{
    if(yr && r.date_str.slice(-4) !== yr) return false;
    if(!q) return true;
    const hay = [r.shoe, r.city, r.run_type, r.terrain, r.note, r.app].join(' ').toLowerCase();
    return hay.includes(q);
  });

  rows = rows.slice().sort((a,b)=>{
    let av = a[sortKey], bv = b[sortKey];
    if(av == null) av = -Infinity;
    if(bv == null) bv = -Infinity;
    if(typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if(av < bv) return sortDir === 'asc' ? -1 : 1;
    if(av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  const tbody = document.getElementById('runsBody');
  const empty = document.getElementById('emptyState');
  if(rows.length === 0){
    tbody.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = rows.map(r=>
      '<tr>'
      + '<td class="mono">'+r.id+'</td>'
      + '<td>'+r.date_str+'</td>'
      + '<td class="mono">'+r.miles.toFixed(2)+' mi</td>'
      + '<td class="mono">'+r.time_str+'</td>'
      + '<td class="mono">'+(r.pace_str||'\u2013')+'</td>'
      + '<td class="mono">'+(r.elev_gain||'\u2013')+' ft</td>'
      + '<td class="mono">'+(r.calories||'\u2013')+'</td>'
      + '<td>'+(r.app||'')+'</td>'
      + '<td>'+(r.city||'')+'</td>'
      + '<td><span class="'+badgeClass(r.run_type)+'">'+(r.run_type||'')+'</span></td>'
      + '<td>'+(r.terrain||'')+'</td>'
      + '<td>'+(r.note||'')+'</td>'
      + '<td>'+(r.shoe||'')+'</td>'
      + '</tr>'
    ).join('');
  }
  document.getElementById('resultCount').textContent = rows.length + ' of ' + RUNS.length + ' runs';
  document.getElementById('footerCount').textContent = rows.length;
}

document.getElementById('searchBox').addEventListener('input', render);
yearFilter.addEventListener('change', render);

document.querySelectorAll('th[data-key]').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.getAttribute('data-key');
    if(sortKey === key){
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortKey = key;
      sortDir = 'asc';
    }
    document.querySelectorAll('th[data-key]').forEach(t=>t.classList.remove('sorted','asc'));
    th.classList.add('sorted');
    if(sortDir === 'asc') th.classList.add('asc');
    render();
  });
});

render();
</script>
